<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: #f8fafc; color: #0f172a; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; background: #fff; border-bottom: 1px solid #e2e8f0; }
  header h1 { font-size: 18px; margin: 0; }
  header span { color: #64748b; font-size: 14px; }
  main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(15,23,42,.06); }
  .bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .bar h2 { margin: 0; font-size: 16px; }
  .actions { display: flex; gap: 8px; }
  button { padding: 10px 16px; border: 0; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; background: #4f46e5; color: #fff; }
  button:hover { background: #4338ca; }
  button.ghost { background: #e2e8f0; color: #0f172a; }
  button.ghost:hover { background: #cbd5e1; }
  .chart-wrap { width: 100%; height: 340px; }
  canvas { width: 100%; height: 100%; display: block; }
  .status { margin-top: 12px; font-size: 13px; color: #16a34a; min-height: 18px; }
</style>
</head>
<body>
  <header>
    <h1>Dashboard</h1>
    <span id="who"></span>
  </header>

  <main>
    <div class="card">
      <div class="bar">
        <h2>Weekly activity (random data)</h2>
        <div class="actions">
          <button id="ctBtn">CleverTap Integration</button>
          <button class="ghost" id="logoutBtn">Logout</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
      <div class="status" id="status"></div>
    </div>
  </main>

  <script src="clevertap-init.js"></script>
  <script>
    var phone = sessionStorage.getItem("phone");
    if (!phone) { window.location.replace("index.html"); }
    document.getElementById("who").textContent = phone ? "+91 " + phone : "";

    // Record the Dashboard event on page load
    ctTrack("Dashboard", { Phone: phone, Page: "Dashboard" });

    // ---------- Vanilla canvas line chart ----------
    var labels = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
    var canvas = document.getElementById("chart");
    var ctx = canvas.getContext("2d");
    var data = randomData();

    function randomData() {
      var arr = [];
      for (var i = 0; i < 7; i++) arr.push(Math.floor(Math.random() * 100) + 10);
      return arr;
    }

    function drawChart() {
      var dpr = window.devicePixelRatio || 1;
      var w = canvas.clientWidth, h = canvas.clientHeight;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      var pad = { l: 40, r: 16, t: 16, b: 32 };
      var cw = w - pad.l - pad.r, ch = h - pad.t - pad.b;
      var max = 120;

      // grid + y labels
      ctx.font = "12px system-ui, sans-serif";
      ctx.fillStyle = "#64748b";
      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 1;
      ctx.textAlign = "right";
      ctx.textBaseline = "middle";
      for (var g = 0; g <= 4; g++) {
        var y = pad.t + ch - (g / 4) * ch;
        ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(w - pad.r, y); ctx.stroke();
        ctx.fillText(Math.round((g / 4) * max), pad.l - 8, y);
      }

      // points
      var pts = data.map(function (v, i) {
        return { x: pad.l + (i / (data.length - 1)) * cw, y: pad.t + ch - (v / max) * ch };
      });

      // x labels
      ctx.textAlign = "center";
      ctx.textBaseline = "top";
      pts.forEach(function (p, i) { ctx.fillText(labels[i], p.x, h - pad.b + 10); });

      // area fill
      ctx.beginPath();
      ctx.moveTo(pts[0].x, pad.t + ch);
      pts.forEach(function (p) { ctx.lineTo(p.x, p.y); });
      ctx.lineTo(pts[pts.length - 1].x, pad.t + ch);
      ctx.closePath();
      ctx.fillStyle = "rgba(79,70,229,.12)";
      ctx.fill();

      // line
      ctx.beginPath();
      pts.forEach(function (p, i) { i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); });
      ctx.strokeStyle = "#4f46e5";
      ctx.lineWidth = 3;
      ctx.lineJoin = "round";
      ctx.stroke();

      // dots
      pts.forEach(function (p) {
        ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2);
        ctx.fillStyle = "#fff"; ctx.fill();
        ctx.strokeStyle = "#4f46e5"; ctx.lineWidth = 2.5; ctx.stroke();
      });
    }

    drawChart();
    window.addEventListener("resize", drawChart);

    // ---------- CleverTap button ----------
    document.getElementById("ctBtn").addEventListener("click", function () {
      data = randomData();
      drawChart();
      ctTrack("CleverTap Integration Clicked", { Phone: phone });
      var s = document.getElementById("status");
      s.textContent = "Event 'CleverTap Integration Clicked' sent to CleverTap.";
      setTimeout(function () { s.textContent = ""; }, 3000);
    });

    document.getElementById("logoutBtn").addEventListener("click", function () {
      sessionStorage.clear();
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
