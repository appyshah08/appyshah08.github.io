<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, Segoe UI, sans-serif; background: linear-gradient(135deg, #eef2ff, #f8fafc); color: #0f172a; }
  .card { width: 100%; max-width: 380px; background: #fff; padding: 32px 28px; border-radius: 16px; box-shadow: 0 10px 30px rgba(15,23,42,.1); margin: 16px; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  p.sub { margin: 0 0 24px; color: #64748b; font-size: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
  input { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 15px; }
  input:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.15); }
  button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 10px; background: #4f46e5; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer; }
  button:hover { background: #4338ca; }
  button:disabled { opacity: .6; cursor: default; }
  .err { color: #dc2626; font-size: 13px; margin-top: 10px; min-height: 18px; }
</style>
</head>
<body>
  <form class="card" id="loginForm" novalidate>
    <h1>Welcome back</h1>
    <p class="sub">Sign in with your phone number</p>

    <label for="phone">Phone number</label>
    <input id="phone" type="tel" inputmode="numeric" placeholder="9876543210" autocomplete="tel">

    <label for="password">Password</label>
    <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">

    <div class="err" id="err"></div>
    <button type="submit" id="submitBtn">Login</button>
  </form>

  <script src="clevertap_init.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var phone = document.getElementById("phone").value.trim();
      var password = document.getElementById("password").value;
      var err = document.getElementById("err");
      var btn = document.getElementById("submitBtn");

      if (!/^\d{10}$/.test(phone)) { err.textContent = "Enter a valid 10-digit phone number."; return; }
      if (password.length < 4) { err.textContent = "Password must be at least 4 characters."; return; }
      err.textContent = "";
      btn.disabled = true;
      btn.textContent = "Signing in...";

      // Identify the user, then record the Login event (password is never sent)
      clevertap.onUserLogin.push({
        Site: { Identity: phone, Phone: "+91" + phone }
      });
      ctTrack("Login", { Phone: phone, Page: "Login" });

      sessionStorage.setItem("phone", phone);

      // Short delay so the SDK can flush the event before navigating away
      setTimeout(function () { window.location.href = "dashboard.html"; }, 800);
    });
  </script>
</body>
</html>
